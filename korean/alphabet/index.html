<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1117">
<title>한글 Flash — Korean alphabet flashcards</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <span class="logo">한</span>
    <div>
      <h1>한글 Flash</h1>
      <p class="sub">Korean alphabet flashcards · click a card to hear it</p>
    </div>
  </div>
  <div class="deck-switch" role="tablist" aria-label="Deck">
    <button role="tab" data-deck="syllables" class="on">음절 <b>399</b></button>
    <button role="tab" data-deck="jamo">자모 <b>40</b></button>
  </div>
</header>

<div class="bar">
  <div class="progress" title="cards seen"><i id="progressFill"></i></div>
  <span id="progressText" class="mono">0 / 399</span>
  <span class="spacer"></span>
  <button id="viewBtn" class="ghost" title="Toggle grid (g)">▦ Grid</button>
  <button id="romBtn" class="ghost on" title="Toggle romanization (s)">가 romanization</button>
  <button id="shuffleBtn" class="ghost" title="Shuffle (r)">⇄ Shuffle</button>
</div>

<main id="study">
  <div class="cardwrap">
    <button id="card" class="card" aria-label="Play pronunciation">
      <span class="glyph" id="glyph">가</span>
      <span class="rom" id="rom">ga</span>
      <span class="hint" id="cardHint">click to play</span>
    </button>
  </div>

  <div class="meta">
    <div class="chips" id="chips" aria-label="Filter by initial consonant"></div>
  </div>

  <div class="controls">
    <button id="prevBtn" class="ctrl" title="Previous (←)">←</button>
    <button id="playBtn" class="ctrl primary" title="Play (space)">▶ Play</button>
    <button id="nextBtn" class="ctrl" title="Next (→)">→</button>
    <span class="counter mono" id="counter">1 / 399</span>
  </div>
  <p class="kbdHint mono">space play · ← → move · r shuffle · g grid · s romanization</p>
</main>

<section id="grid" class="grid hidden" aria-label="All cards"></section>

<footer class="foot">
  <span id="footInfo" class="mono"></span>
  <span class="spacer"></span>
  <span class="mono">voice: ko-KR · offline audio</span>
</footer>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
