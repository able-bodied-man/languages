<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>한글 Flash — Korean alphabet flashcards</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <span class="logo">한</span>
    <div>
      <h1>한글 Flash</h1>
      <p class="sub">tap to hear · swipe right = good, left = bad</p>
    </div>
  </div>
  <div class="deck-switch" role="tablist" aria-label="Deck">
    <button role="tab" data-deck="syllables" class="on">음절 <b>399</b></button>
    <button role="tab" data-deck="jamo">자모 <b>40</b></button>
  </div>
</header>

<div class="bar">
  <div class="progress" title="cards seen"><i id="progressFill"></i></div>
  <span id="progressText" class="mono">0 / 399</span>
  <span class="spacer"></span>
  <div class="controls">
    <button id="viewBtn" class="ghost" title="Toggle grid (g)">▦ Grid</button>
    <button id="romBtn" class="ghost" title="Toggle romanization (s)"><span class="wide">가 romanization</span><span class="narrow">가 rom</span></button>
    <button id="shuffleBtn" class="ghost" title="Shuffle (r)">⇄ Shuffle</button>
    <button id="resetBtn" class="ghost danger" title="Clear all progress">↺ Clear</button>
  </div>
</div>

<main id="study">
  <div class="cardwrap">
    <button id="card" class="card" aria-label="Tap to hear the pronunciation; swipe right for good, left for bad">
      <span class="verdict good" id="verdictGood">알아요 · good</span>
      <span class="verdict bad" id="verdictBad">몰라요 · bad</span>
      <span class="glyph" id="glyph">가</span>
      <span class="rom" id="rom">ga</span>
      <span class="hint" id="cardHint">tap to hear · swipe to grade</span>
    </button>
  </div>
</main>

<section id="grid" class="grid hidden" aria-label="All cards"></section>

<footer class="foot">
  <span id="footInfo" class="mono"></span>
  <span class="spacer"></span>
  <span id="scoreInfo" class="mono"></span>
</footer>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
